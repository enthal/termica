name: CI

on:
  push:
    branches: [main]
  pull_request:
  # `merge_group` fires when GitHub's merge queue rebases a PR onto the
  # queue head and dispatches CI on the resulting `gh-readonly-queue/...`
  # ref. Including it now means required-status-checks keep working if
  # we enable the merge queue later.
  merge_group:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUST_BACKTRACE: short

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel stale PR builds when a new push lands; never cancel `main`
  # or merge-queue refs — the queue depends on each speculative build
  # completing on the exact rebuilt commit it dispatched.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/heads/gh-readonly-queue/') }}

# NOTE: the `toolchain` value below is pinned — keep it in sync with
# `rust-toolchain.toml` at the workspace root. Bump both in the same
# commit when we deliberately move forward. dtolnay/rust-toolchain
# honors the file too, but passing the version explicitly keeps the
# invariant visible on every job.

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # egui_kittest's snapshot feature renders through wgpu; on Ubuntu
      # runners that means we need the Vulkan loader + a software
      # backend so headless rendering works. macOS uses Metal and needs
      # nothing extra. Matches knauty's CI setup.
      - name: Install Linux GPU deps
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux GPU deps
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - run: cargo test --workspace --locked
