name: Release

# Builds native installers and attaches them to the GitHub Release.
#
# - On a `v*` tag (pushed by release-plz with a PAT — see release-plz.yml):
#   build, package, and create/update the GitHub Release with the artifacts.
# - On manual dispatch: build + package and upload as workflow artifacts only
#   (no release). Use this to test the pipeline (incl. signing) without cutting
#   a version.
#
# macOS code signing + notarization (see spec/12-distribution.md):
#   - cargo-packager imports the Developer ID cert from APPLE_CERTIFICATE (a
#     base64 full-chain .p12 — leaf + Developer ID G2 intermediate + key) into a
#     temporary keychain and signs Termica.app with hardened runtime + a secure
#     timestamp, then builds the .dmg around it.
#   - A dedicated step then submits the .dmg to Apple's notary service with an
#     App Store Connect API key and staples the ticket, so the downloaded image
#     opens with no Gatekeeper prompt (even offline).
# Both are gated on HAS_APPLE_SIGNING (the secrets being present); without them
# the build still succeeds, producing unsigned artifacts.

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write # create releases / upload assets

jobs:
  package:
    name: Package (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    env:
      # True only when the Apple secrets are configured (i.e. on this repo, not
      # forks). The signing/notarization steps below no-op when false.
      HAS_APPLE_SIGNING: ${{ secrets.APPLE_CERTIFICATE != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14 # Apple Silicon
            label: macos-arm64
            formats: dmg
            release_files: dist/*.dmg
          - os: macos-15-intel # Intel (macos-13 runner was retired)
            label: macos-x64
            formats: dmg
            release_files: dist/*.dmg
          - os: ubuntu-22.04
            label: linux-x64
            formats: deb,appimage # comma-separated: space-separated reads the 2nd as a subcommand
            # Per-platform globs: each job only produces its own artifacts, so
            # listing all three formats here with fail_on_unmatched_files would
            # fail every job on the patterns it can't match.
            release_files: |
              dist/*.deb
              dist/*.AppImage
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libfuse2

      # The repo pins its toolchain via rust-toolchain.toml; the first cargo
      # invocation auto-installs it. rust-cache keeps build times sane.
      - uses: Swatinem/rust-cache@v2

      # Prebuilt cargo-packager (avoids recompiling it under the pinned
      # toolchain, and is much faster). --force because rust-cache can restore
      # binstall's "already installed" metadata without the actual binary
      # (it doesn't cache ~/.cargo/bin), which otherwise makes binstall skip
      # the install and leaves `cargo packager` missing. Pinned for determinism.
      - uses: cargo-bins/cargo-binstall@main
      - name: Install cargo-packager
        # NOTE: use --version, never `cargo-packager@0.11.8` — an `@<dotted
        # version>` looks like an email and gets silently mangled to
        # "[email protected]" in transit (same gotcha that hit the action ref).
        run: cargo binstall -y --force --version 0.11.8 cargo-packager

      - name: Configure macOS signing identity
        # cargo-packager only runs its signing path (import the cert into a temp
        # keychain, then `codesign --options runtime --timestamp`) when
        # `macos.signing-identity` is set in config — APPLE_CERTIFICATE alone is
        # ignored. We inject it here, gated on the secrets, so forks without the
        # cert still build unsigned (the committed Cargo.toml stays clean). The
        # identity string is NOT secret — it's the cert's CommonName, embedded in
        # every signed build.
        if: runner.os == 'macOS' && env.HAS_APPLE_SIGNING == 'true'
        shell: bash
        run: |
          cat >> Cargo.toml <<'EOF'

          [package.metadata.packager.macos]
          signing-identity = "Developer ID Application: Timothy James (V64896A4F2)"
          EOF

      - name: Build & package
        env:
          # macOS only: with signing-identity configured (previous step),
          # cargo-packager imports this .p12 into a temp keychain and signs
          # Termica.app with hardened runtime + a secure timestamp. Empty on forks
          # → no signing-identity, so it builds unsigned and continues.
          # (Notarization is handled by the next step, not by cargo-packager.)
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: cargo packager --release --formats ${{ matrix.formats }} --verbose

      - name: Notarize & staple the DMG
        # macOS only, and only when the Apple secrets exist. Submits the signed
        # .dmg to Apple's notary service and staples the ticket. `stapler` is the
        # safety gate: it can only succeed if notarization was Accepted, so a
        # rejected build fails the job here rather than shipping a bad artifact.
        if: runner.os == 'macOS' && env.HAS_APPLE_SIGNING == 'true'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$key"
          trap 'rm -f "$key"' EXIT
          shopt -s nullglob
          dmgs=(dist/*.dmg)
          if [ ${#dmgs[@]} -eq 0 ]; then
            echo "::error::No .dmg found to notarize"; exit 1
          fi
          for dmg in "${dmgs[@]}"; do
            echo "Notarizing $dmg"
            xcrun notarytool submit "$dmg" \
              --key "$key" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" \
              --wait
            xcrun stapler staple "$dmg"
            xcrun stapler validate "$dmg"
          done

      - name: Verify signature & notarization
        # Actively assert the artifact is acceptable rather than trusting the
        # staple step implicitly. Checks the .dmg via Gatekeeper, then mounts it
        # and runs a full codesign verify + Gatekeeper exec check on Termica.app.
        # `set -e` means any failure here fails the job.
        if: runner.os == 'macOS' && env.HAS_APPLE_SIGNING == 'true'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for dmg in dist/*.dmg; do
            echo "== verifying $dmg =="
            spctl -a -vvv -t open --context context:primary-signature "$dmg"
            mnt="$(mktemp -d)"
            hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mnt"
            trap 'hdiutil detach "$mnt" >/dev/null 2>&1 || true' EXIT
            codesign --verify --deep --strict --verbose=2 "$mnt/Termica.app"
            spctl -a -vvv -t exec "$mnt/Termica.app"
            hdiutil detach "$mnt" >/dev/null
            trap - EXIT
          done

      - name: List artifacts
        shell: bash
        run: ls -la dist || true

      - name: Upload workflow artifacts (manual test runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: termica-${{ matrix.label }}
          path: ${{ matrix.release_files }}
          if-no-files-found: error

      - name: Attach to GitHub Release (tagged runs)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: ${{ matrix.release_files }}
