[package]
name = "termica"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/enthal/termica"
description = "A native terminal workspace with a modern editor-driven shell experience, built on Rust and egui."
rust-version = "1.95"

[workspace]
# A single root crate today; the architecture in spec/01-architecture.md
# expands this into a multi-crate workspace as phases land. Keeping the
# `[workspace]` table here so `cargo` commands behave the same the day
# a second crate appears.
members = ["."]

[lib]
name = "termica"
path = "src/lib.rs"

[[bin]]
name = "termica"
path = "src/main.rs"

[dependencies]
# Phase 1B: native window via eframe + egui. egui pulls in the painter
# layer we will use directly for the custom cell renderer in Phase 1E.
eframe = { version = "0.33", default-features = true }
egui = "0.33"

# App-window icon: decode the embedded `assets/app_icon.png` into the
# RGBA buffer `egui::IconData` wants. Already in the graph transitively
# via eframe; we only need the PNG decoder, so strip the default codec
# set to keep our direct surface minimal.
image = { version = "0.25", default-features = false, features = ["png"] }

# Phase 1C: pseudo-terminal plumbing. Synchronous spawn / read / write /
# resize. The tokio/async layering arrives in Phase 1D once there is a
# consumer that needs to drain PTY bytes into `alacritty_terminal`.
portable-pty = "0.9"

# Phase 1D: VT/ANSI state engine. Owns the grid, cursor, alternate
# screen, escape interpretation — we never parse VT bytes ourselves.
# `default-features = false` strips the `serde` feature; we don't
# need serialization of the grid at this layer.
alacritty_terminal = { version = "0.26", default-features = false }

# Phase 1E-h: low-level VT byte parser. We run a thin OSC-only
# sniffer in parallel with alacritty's full parser so we can
# observe OSC 7 (cwd from the shell), OSC 8 (hyperlinks), and our
# own Phase 3 markers — none of which alacritty surfaces through
# its `EventListener`. Same crate alacritty itself uses; pinning to
# 0.15 (matches alacritty_terminal 0.26's transitive dep).
vte = { version = "0.15", default-features = false }

# Error-type ergonomics. Used by `pty::PtyError` to keep the public
# surface narrow without losing the wrapped source's text.
thiserror = "2"
egui_tiles = "0.14"

# Canonical home-directory lookup (rust-lang org). We use it to
# resolve `$HOME` for the `~`-prefix substitution in tab titles. It
# falls back to a passwd lookup when `HOME` isn't set and handles
# the platform differences `std::env::home_dir` got wrong (which is
# why that stdlib fn was deprecated).
home = "0.5"

# Phase 3C: JSON parsing for DCS-JSON shell-integration messages
# (spec/03). We parse the bytes between `ESC P Termica;` and `ESC \`
# as a single JSON object. `default-features = false` keeps the
# `std` feature (which is what `default = ["std"]` is) since we are
# always on std, and disables the `arbitrary_precision` feature we
# don't need.
#
# `preserve_order` makes `serde_json::Map` insertion-ordered (backed
# by `IndexMap`) instead of alpha-sorted (the default `BTreeMap`
# backing). The `--dump-events` JSON Lines writer relies on this so
# every record begins with `t`, `pane`, `kind` (the envelope) before
# any per-kind fields — matches the schema example in spec/03 and
# keeps `tail -f` readable.
serde_json = { version = "1", features = ["preserve_order"] }

# Phase 3E: per-session scratch directory for shell-integration
# wrappers (zsh's `.zshrc` under our ZDOTDIR, bash's `--rcfile`).
# These are regenerated on every spawn from `include_str!` constants
# and read exactly once by the shell at startup — they have no
# persistent value and don't belong in `directories::data_dir()`.
# `tempfile::TempDir` auto-deletes on Drop, and we tie its lifetime
# to `PaneSession` so the wrapper survives long enough for zsh /
# bash to source it and disappears the moment the pane closes.
tempfile = "3"

# Phase 3E: UUIDv4 generation for TERMICA_SESSION_ID. Each spawned
# shell carries a session ID in its environment; the integration
# script echoes it back in every DCS-JSON message so messages from
# a stale child can be discriminated.
uuid = { version = "1", features = ["v4"] }

# Phase 4J: command-history persistence. SQLite, bundled so users
# don't need a system `libsqlite3`. ~500 KB to the binary; in
# exchange we get full SQL (range scans, GROUP BY, indexes) for the
# `runs` table that backs `↑` / `↓` recall + `^R` reverse search.
# See [spec/08](spec/08-persistence.md) for the schema.
rusqlite = { version = "0.34", features = ["bundled"] }

# Phase 4J: choose the right OS-conventional data directory for
# `history.sqlite`. On macOS `~/Library/Application Support/termica`,
# on Linux `${XDG_DATA_HOME:-~/.local/share}/termica`, on Windows
# `%APPDATA%/termica/data`. Avoids hard-coding any one platform's
# convention and matches what spec/08 calls "`<data-dir>/`".
directories = "5"

# Phase 8: the in-pane find overlay's regex match mode (spec/07
# §"Search engine"). Literal + case-insensitive matching is done in
# our own char-column scanner (so highlight columns line up with the
# cell grid); regex is delegated to this crate via `RegexBuilder`
# with `case_insensitive` wired to the overlay's `Aa` toggle.
regex = "1"

# macOS-only: we need `EventLoopBuilderExtMacOS::with_default_menu(false)`
# to disable winit's default app menubar. Its Quit item invokes
# `[NSApplication terminate:]` directly, which bypasses our key
# handler AND `viewport().close_requested()` — by the time `update()`
# would run, the app is already terminating. Without the default menu,
# Cmd+Q reaches the window as a normal `Key::Q` event and routes
# through the quit-confirm modal. Pinned to the same major as eframe's
# transitive dep so cargo resolves to a single `winit` in the graph.
[target.'cfg(target_os = "macos")'.dependencies]
winit = "0.30"

# Cross-platform native menu construction (tauri-apps). We use it to
# build our own macOS menubar with a Quit item whose action targets a
# selector we control (not `[NSApp terminate:]`). winit's default menu
# is disabled via `with_default_menu(false)` so muda's menu is the
# only menubar installed. Linux/Windows don't get a menubar yet —
# `match_pane_shortcut` handles Ctrl+Shift+Q etc. natively there.
muda = "0.19"

[dev-dependencies]
# Snapshot-driven UI tests (knauty pattern). Pinned to the egui major
# series we depend on so the harness sees the same egui types.
egui_kittest = { version = "0.33", features = ["wgpu", "snapshot"] }
