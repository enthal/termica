<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Termica — a modern interface for the shell you already use</title>
  <meta name="description" content="Termica is a modern interface for the shell you already use — a real, native terminal in Rust, with vim, ssh and tmux working exactly as they should." />

  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="theme-color" content="#03070f" />

  <!-- Open Graph / social -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Termica — a modern interface for the shell you already use" />
  <meta property="og:description" content="A real, native terminal in Rust. vim, ssh, htop, tmux — all exactly as they should be. With command blocks, history, and completion on top." />
  <meta property="og:url" content="https://termica.io/" />
  <meta property="og:image" content="https://termica.io/img/og.jpg" />
  <meta property="og:image:type" content="image/jpeg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="glow" aria-hidden="true"></div>

  <header class="hero">
    <img class="logo" src="/icon.png" width="140" height="140"
         alt="Termica icon — a neon T over a terminal prompt" />

    <h1 class="wordmark">Termica</h1>

    <p class="tagline">
      A modern interface for the shell you already use.
    </p>
  </header>

  <figure class="shot">
    <img src="/img/hero.webp" srcset="/img/hero.webp 1x, /img/hero@2x.webp 2x"
         width="1000" height="647" decoding="async"
         alt="Termica running three panes: a stack of command blocks with cwd, exit-code and duration chips and a syntax-highlighted prompt; bat viewing Rust source; and htop running full-width." />
  </figure>

  <div class="cta">
    <a class="btn btn-primary" href="https://github.com/enthal/termica">
      View on GitHub
    </a>
    <p class="meta muted">Built in Rust with egui · Open source</p>
  </div>

  <footer class="footer muted">
    <a class="footer-link" href="https://github.com/enthal/termica">GitHub</a>
    <span aria-hidden="true">·</span>
    <span>&copy; <span id="year">2026</span> Termica</span>
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
